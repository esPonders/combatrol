name: Audit release paths
on:
  push:
    branches: [main]
    paths: [.github/workflows/privacy-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Inspect published release ZIP for local paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import io, json, os, re, urllib.request, zipfile, hashlib
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(url, accept=None):
              h = dict(headers)
              if accept: h['Accept'] = accept
              with urllib.request.urlopen(urllib.request.Request(url, headers=h)) as r: return r.read()
          release = json.loads(get(base + '/releases/tags/v1.0.0'))
          asset = next(a for a in release['assets'] if a['name'] == 'Valmods.RolCombat-1.0.0.zip')
          data = get(asset['url'], 'application/octet-stream')
          print('Release ZIP SHA256:', hashlib.sha256(data).hexdigest())
          personal = []
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for name in z.namelist():
                  blob = z.read(name)
                  strings = re.findall(rb'[\x20-\x7e]{6,}', blob)
                  strings += [s.encode() for s in re.findall(r'[\x20-\x7e]{6,}', blob.decode('utf-16le', errors='ignore'))]
                  paths = [s.decode() for s in strings if b'/home/' in s or b'/var/home/' in s or b'C:\\Users\\' in s]
                  for path in paths:
                      print(name, 'build path:', path)
                      personal.append(name)
          assert not personal, 'Non-runner personal paths found: ' + repr(personal)
          print('PASS: no home-directory paths found in release ZIP.')
          PY
