name: Build and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: dotnet build src/RolCombat/RolCombat.csproj -c Release -p:RestoreLockedMode=true
      - run: dotnet run --project tests/RolCombatChecks -c Release
      - run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: RolCombat-r2modman
          path: dist/*.zip
          if-no-files-found: error
